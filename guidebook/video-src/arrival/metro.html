<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Metro film</title>
<!-- "Metro" film: the entrance, the Atto card at the ticket office, the turnstile, a train. -->
<link rel="stylesheet" href="film.css" />
<style>
  .under { position: absolute; inset: 0; z-index: 5; overflow: hidden; background: linear-gradient(180deg, #f3eee4 0%, #f1ebe0 61%, #e9e3d6 61%); }
  .under .floor { position: absolute; left: 0; top: 1180px; width: 2400px; height: 740px; background: #ece6da; border-top: 6px solid var(--ink); }
  .uworld { position: absolute; left: 0; top: 0; width: 2400px; height: 1920px; }
  .atto { position: absolute; left: 170px; top: 470px; width: 740px; height: 466px; z-index: 18; border-radius: 36px; overflow: hidden;
    background: linear-gradient(135deg, #1b4f8f, #2d6fbf); color: #fff; box-shadow: 0 60px 120px -40px rgb(10 30 60 / 0.7); }
  .atto b { position: absolute; left: 54px; top: 50px; font-size: 80px; letter-spacing: 0.06em; font-weight: 800; }
  .atto span { position: absolute; left: 56px; bottom: 54px; font-size: 32px; opacity: 0.9; }
  .atto svg { position: absolute; right: 50px; top: 50px; width: 90px; }
  .atto .m { position: absolute; right: 54px; bottom: 44px; width: 110px; height: 110px; border-radius: 50%; background: #fff; color: #1b4f8f; display: grid; place-items: center; font-size: 66px; font-weight: 800; }
  .price { position: absolute; z-index: 17; padding: 18px 30px; border-radius: 999px; background: #fff; box-shadow: 0 20px 40px -18px rgb(0 0 0 / 0.4), inset 0 0 0 3px var(--ink); font-size: 44px; font-weight: 800; white-space: nowrap; }
  .price small { font-size: 30px; font-weight: 600; color: var(--ink-3); margin-left: 8px; }
  .hours { position: absolute; left: 64px; top: 230px; z-index: 16; padding: 14px 28px; border-radius: 999px; background: var(--night); color: #fff; font-size: 40px; font-weight: 750; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- the street and the entrance -->
  <svg class="abs" width="200" height="420" style="left:40px;top:766px"><path class="line" d="M100 414 V230"/><circle cx="100" cy="170" r="84" fill="#bfe3c9" stroke="#0e1a18" stroke-width="6"/></svg>
  <svg class="abs" width="620" height="760" style="left:440px;top:426px">
    <path class="line" d="M480 20 V420"/>
    <circle cx="480" cy="90" r="80" fill="#1b4f8f" stroke="#0e1a18" stroke-width="6"/>
    <text x="480" y="122" text-anchor="middle" fill="#fff" font-size="96" font-weight="800" font-family="Onest">M</text>
    <path d="M20 754 V520 Q20 470 70 470 H430 Q480 470 480 520 V754" fill="#fff" stroke="#0e1a18" stroke-width="6"/>
    <path d="M60 754 V560 H440 V754" fill="#3a3f3e" stroke="#0e1a18" stroke-width="6"/>
    <g stroke="#f2f5f3" stroke-width="6" stroke-linecap="round" opacity=".5"><path d="M90 620 H410 M110 670 H390 M130 720 H370"/></g>
  </svg>

  <!-- underground: ticket office, turnstile, platform -->
  <div class="under" id="under">
    <div class="uworld" id="uworld">
      <div class="floor"></div>
      <!-- arches and chandeliers along the hall -->
      <svg class="abs" width="2400" height="760" style="left:0;top:420px">
        <g fill="none" stroke="#0e1a18" stroke-width="6">
          <path d="M0 760 V300 Q120 140 240 300 V760"/><path d="M480 760 V300 Q600 140 720 300 V760"/><path d="M1300 760 V300 Q1420 140 1540 300 V760"/><path d="M1780 760 V300 Q1900 140 2020 300 V760"/>
        </g>
        <g><path class="line" d="M360 0 V90 M1100 0 V90 M1660 0 V90 M2240 0 V90"/>
          <g fill="#ffe7a3" stroke="#0e1a18" stroke-width="5"><path d="M320 90 H400 L380 140 H340z"/><path d="M1060 90 H1140 L1120 140 H1080z"/><path d="M1620 90 H1700 L1680 140 H1640z"/><path d="M2200 90 H2280 L2260 140 H2220z"/></g></g>
      </svg>
      <!-- ticket office -->
      <svg class="abs" width="360" height="430" style="left:40px;top:756px">
        <rect x="10" y="10" width="340" height="414" rx="16" fill="#fff" stroke="#0e1a18" stroke-width="6"/>
        <rect x="40" y="70" width="280" height="150" rx="10" fill="#dfeef5" stroke="#0e1a18" stroke-width="5"/>
        <circle cx="180" cy="140" r="34" fill="#fff" stroke="#0e1a18" stroke-width="5"/>
        <path d="M134 220 Q134 176 180 176 Q226 176 226 220" fill="#1b4f8f" stroke="#0e1a18" stroke-width="5"/>
        <rect x="60" y="20" width="240" height="40" rx="10" fill="#1b4f8f"/><text x="180" y="50" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Onest" id="kassaT"></text>
        <path d="M40 250 H320" stroke="#0e1a18" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <!-- turnstile -->
      <svg class="abs" width="260" height="300" style="left:820px;top:886px">
        <rect x="20" y="60" width="60" height="234" rx="12" fill="#fff" stroke="#0e1a18" stroke-width="6"/>
        <rect x="180" y="60" width="60" height="234" rx="12" fill="#fff" stroke="#0e1a18" stroke-width="6"/>
        <rect x="26" y="80" width="48" height="34" rx="8" fill="#1b4f8f"/>
        <circle id="lamp" cx="50" cy="140" r="12" fill="#c8372d"/>
        <rect id="gateBar" x="80" y="160" width="100" height="14" rx="7" fill="#0e1a18" style="transform-origin:80px 167px"/>
      </svg>
      <!-- platform edge -->
      <svg class="abs" width="1300" height="40" style="left:1100px;top:1186px"><path d="M0 14 H1300" stroke="#ffd34d" stroke-width="12" stroke-dasharray="40 24"/></svg>
      <!-- train -->
      <svg class="abs" id="train" width="1500" height="330" viewBox="0 0 1500 330">
        <path d="M60 30 H1380 Q1480 30 1490 160 V300 H60 Q20 300 20 260 V70 Q20 30 60 30z" fill="#fff" stroke="#0e1a18" stroke-width="6"/>
        <path d="M20 200 H1490" stroke="#1b4f8f" stroke-width="20"/>
        <g fill="#dfeef5" stroke="#0e1a18" stroke-width="5"><rect x="80" y="70" width="160" height="90" rx="12"/><rect x="520" y="70" width="160" height="90" rx="12"/><rect x="960" y="70" width="160" height="90" rx="12"/></g>
        <g fill="#cfe0d8" stroke="#0e1a18" stroke-width="5"><rect id="door1" x="300" y="60" width="160" height="240"/><rect id="door2" x="740" y="60" width="160" height="240"/><rect x="1180" y="60" width="160" height="240"/></g>
        <path d="M1400 60 Q1460 70 1470 150 H1400z" fill="#dfeef5" stroke="#0e1a18" stroke-width="5"/>
        <circle cx="200" cy="310" r="16" fill="#0e1a18"/><circle cx="1300" cy="310" r="16" fill="#0e1a18"/>
      </svg>
    </div>
  </div>

  <div class="hours" id="hours"></div>
  <div class="price" id="price"></div>

  <div class="atto" id="atto">
    <b>ATTO</b>
    <svg viewBox="0 0 24 24"><path d="M8 7a7 7 0 010 10M12 5a10 10 0 010 14M16 3a13 13 0 010 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <span id="attoT"></span>
    <div class="m">M</div>
  </div>
</div>
<script src="film.js"></script>
<script>
const { p, key, fade, $, set, card, person, walk, init, captions, progress, final, play, easeOut, back, easeInOut } = Film;
const T = init({
  ru: {
    c: [['Метро', 'Метро Ташкента', 'Быстро и без пробок. Работает примерно с 05:00 до 00:00.'],
        ['Шаг 1', 'Купите карту Atto', 'В кассе метро. Многоразовая карта экономит время и деньги.'],
        ['Шаг 2', 'Приложите карту — и в путь', 'Проезд с 01.10.2026: 2 500 сум картой, 3 000 сум наличными.']],
    hours: '05:00 — 00:00', kassa: 'КАССА', atto: 'Транспортная карта', price: '2 500 сум', priceSmall: 'картой',
    final: { title: 'Вы в пути', items: [{ text: 'Карта Atto куплена' }, { text: '2 500 сум за поездку' }, { text: 'Станции — как подземный музей' }, { text: 'Такси — только через приложение', small: 'Yandex Go по всей стране, MyTaxi — в Ташкенте', next: true }] },
  },
  en: {
    c: [['Metro', 'The Tashkent metro', 'Fast and traffic-free. Runs roughly from 05:00 to 00:00.'],
        ['Step 1', 'Buy an Atto card', 'At the metro ticket office. A reusable card saves time and money.'],
        ['Step 2', 'Tap the card and go', 'From 01.10.2026: 2,500 sum by card, 3,000 sum in cash.']],
    hours: '05:00 — 00:00', kassa: 'TICKETS', atto: 'Transport card', price: '2,500 sum', priceSmall: 'by card',
    final: { title: 'You are on your way', items: [{ text: 'Atto card bought' }, { text: '2,500 sum a ride' }, { text: 'Stations like an underground museum' }, { text: 'Taxi — only through an app', small: 'Yandex Go nationwide, MyTaxi in Tashkent', next: true }] },
  },
});
$('stage').insertAdjacentHTML('beforeend', person('me', { bag: false }));
$('uworld').insertAdjacentHTML('beforeend', person('me2', { bag: false }));
$('hours').textContent = T.hours; $('kassaT').textContent = T.kassa; $('attoT').textContent = T.atto;
$('price').innerHTML = `${T.price}<small>${T.priceSmall}</small>`;

const IN = 5.4;
const ME2 = [[IN, -160], [7.2, 300], [11.4, 300], [12.6, 860], [13.6, 1060], [16.4, 1060], [17.2, 1380], [30, 1380]];
function render(t) {
  const inside = t >= IN;
  // outside: walk to the M and go down
  walk('me', t, [[0, -160], [3.4, 600], [4.8, 700], [IN, 700]], { show: inside ? 0 : 1 - p(t, 4.0, 4.8) });
  set('hours', { opacity: fade(t, 0.6, 1.0, 4.6, 5.0) });
  const cut = p(t, IN - 0.4, IN + 0.3);
  set('under', { opacity: cut, clipPath: `circle(${cut * 150}% at 60% 70%)` });
  // underground: ticket office → turnstile → platform
  const x = key(t, ME2);
  const cam = Math.max(0, Math.min(2400 - 1080, x - 480)) * p(t, 11.6, 12.6);
  set('uworld', { transform: `translateX(${-cam}px)` });
  walk('me2', t, ME2, { show: inside ? 1 : 0, arm: -Math.max(p(t, 13.0, 13.3) - p(t, 13.9, 14.2), 0) * 60 });
  card('atto', t, 7.6, 11.2);
  set($('atto'), { rotate: `${Math.sin(t * 2) * 1.5}deg` });
  const open = p(t, 13.3, 13.7);
  set('gateBar', { transform: `rotate(${open * 80}deg)` });
  $('lamp').setAttribute('fill', t > 13.3 ? '#1aa752' : '#c8372d');
  const pr = fade(t, 13.3, 13.7, 15.4, 15.8);
  set('price', { left: `${860 - cam - 40}px`, top: `${700 - pr * 30}px`, opacity: pr, transform: `scale(${0.85 + pr * 0.15})` });
  // the train comes in, doors open, the train leaves
  const tx = key(t, [[0, 1080 + 1700], [14.2, 1080 + 1700], [16.0, 1000], [18.0, 1000], [20.4, -1800]], easeInOut);
  set('train', { transform: `translate(${tx}px, ${1180 - 330 + 20}px)` });
  const d = Math.max(p(t, 16.0, 16.4) - p(t, 17.4, 17.8), 0);
  $('door1').setAttribute('width', 160 - d * 150);
  if (t > 16.9) set('me2', { opacity: 1 - p(t, 16.9, 17.4) });

  captions(t, [[T.c[0], 0.3, 5.4], [T.c[1], 5.6, 11.4], [T.c[2], 11.6, 20.6]]);
  progress(t, [[0, 5.4], [5.4, 11.5], [11.5, 20.7]]);
  final(t, 20.8);
}
play(render, 27.5);
</script>
</body>
</html>
